<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LearnWithCats</title>
    <meta name="description" content="Learn the ideas of coding by writing cats in a tiny language and seeing them in Python, JavaScript, C and C++." />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>LearnWithCats</h1>
        <p class="tagline" data-t="tagline"></p>
      </div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="it">IT</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel stage-panel">
        <h2 data-t="stage"></h2>
        <div id="stage" class="stage"></div>
        <div id="cards" class="cards"></div>
        <details class="mastery" id="mastery-box" open>
          <summary data-t="mastery"></summary>
          <p class="hint" data-t="masteryHint"></p>
          <div id="mastery" class="mastery-grid"></div>
        </details>
      </section>

      <section class="panel editor-panel">
        <div class="panel-head">
          <h2 data-t="program"></h2>
          <label class="write-in"><span data-t="writeIn"></span>
            <select id="source-lang">
              <option value="cat">Cat</option>
              <option value="python">Python</option>
              <option value="javascript">JavaScript</option>
              <option value="c">C</option>
              <option value="cpp">C++</option>
            </select>
          </label>
        </div>
        <div class="toolbar">
          <select id="examples" aria-label="Examples"></select>
          <button type="button" id="run" class="run" data-t="run"></button>
          <button type="button" id="to-world" class="to-world" data-t="toWorld" disabled></button>
        </div>
        <p id="run-status" class="run-status" aria-live="polite"></p>
        <div class="editor-wrap">
          <pre id="gutter" aria-hidden="true"></pre>
          <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Cat program"></textarea>
        </div>
        <h2 class="small-head" data-t="problems"></h2>
        <ul id="messages" class="messages" aria-live="polite"></ul>
        <details class="cheatsheet">
          <summary data-t="cheatsheet"></summary>
          <p data-t="cheatsheetHint"></p>
          <ul id="cheatsheet-list"></ul>
        </details>
      </section>

      <section class="panel code-section">
        <div class="panel-head">
          <h2 data-t="realCode"></h2>
        </div>
        <div id="code-tabs" class="code-tabs" role="tablist"></div>
        <pre id="code" class="code-view" role="tabpanel" aria-live="polite"></pre>
        <p class="code-hint" data-t="codeHint"></p>
      </section>

      <section class="panel world-panel" id="world">
        <div class="panel-head">
          <h2 data-t="world"></h2>
          <div class="world-tabs" role="tablist">
            <button type="button" role="tab" data-view="square" data-t="square" aria-selected="true"></button>
            <button type="button" role="tab" data-view="cemetery" data-t="cemetery" aria-selected="false"></button>
          </div>
        </div>
        <p class="hint" data-t="worldHint"></p>
        <p id="world-mode" class="world-mode" data-t="loadingWorld"></p>
        <div id="square-view">
          <div id="square" class="square"></div>
          <div class="player-row">
            <label><span data-t="playerName"></span>
              <input id="player-name" maxlength="20" autocomplete="nickname" />
            </label>
            <span id="your-count" class="hint"></span>
          </div>
          <p id="world-status" class="run-status" aria-live="polite"></p>
          <h3 class="small-head" data-t="livingTitle"></h3>
          <ul id="living" class="living"></ul>
        </div>
        <div id="cemetery-view" hidden>
          <ul id="cemetery" class="cemetery"></ul>
        </div>
      </section>
    </main>

    <footer class="foot"><p data-t="footer"></p></footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
